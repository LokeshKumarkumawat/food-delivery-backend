apiVersion: apps/v1
kind: Deployment
metadata:
  name: foodapp
  namespace: foodapp
  labels:
    app.kubernetes.io/name: foodapp
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: foodapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: foodapp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: foodapp
          image: food-delivery-backend:v3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
            - name: management
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: foodapp-config
            - configMapRef:
                name: foodapp-config-local
            - secretRef:
                name: foodapp-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
      terminationGracePeriodSeconds: 45
---
apiVersion: v1
kind: Service
metadata:
  name: foodapp
  namespace: foodapp
  labels:
    app.kubernetes.io/name: foodapp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: foodapp
  ports:
    - name: http
      port: 8090
      targetPort: http
    - name: management
      port: 9090
      targetPort: management