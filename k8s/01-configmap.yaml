apiVersion: v1
kind: ConfigMap
metadata:
  name: foodapp-config
  namespace: foodapp
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8090"

  SPRING_DATASOURCE_URL: "jdbc:mysql://foodapp-mysql.foodapp.svc.cluster.local:3306/foodapp?useSSL=true&serverTimezone=Asia/Kolkata"
  SPRING_DATA_REDIS_HOST: "foodapp-redis-master.foodapp.svc.cluster.local"
  SPRING_DATA_REDIS_PORT: "6379"

  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4318"
  OTEL_SERVICE_NAME: "food-delivery-backend"

  MANAGEMENT_SERVER_PORT: "9090"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
