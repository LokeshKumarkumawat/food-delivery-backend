# TEMPLATE ONLY -- never commit the real thing.
#
# A Kubernetes Secret is base64, which is encoding, not encryption. Anyone with
# read access to the namespace can decode it. For anything real use the
# External Secrets Operator backed by AWS Secrets Manager (see
# docs/DEPLOYMENT.md), or Sealed Secrets if you want it in git.
#
# Better still for AWS: IRSA removes AWS_ACCESS_KEY_ID and AWS_SECRET_KEY
# entirely. The pod assumes an IAM role; there is no key to leak.

apiVersion: v1
kind: Secret
metadata:
  name: foodapp-secrets
  namespace: foodapp
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "REPLACE_ME"
  SPRING_DATASOURCE_PASSWORD: "REPLACE_ME"
  SECRETE_JWT_STRING: "REPLACE_ME"
  STRIPE_SECRET_KEY: "REPLACE_ME"
  STRIPE_WEBHOOK_SECRET: "REPLACE_ME"
  MAIL_USERNAME: "REPLACE_ME"
  MAIL_PASSWORD: "REPLACE_ME"
